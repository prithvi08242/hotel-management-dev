deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # requires manual approval - set up reviewers in repo settings
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name hms-cluster --region ${{ vars.AWS_REGION }}

      - name: Apply production manifests
        run: |
          kubectl apply -f k8s/production/namespace.yml
          kubectl apply -f k8s/production/postgres.yml
          kubectl apply -f k8s/production/backend.yml
          kubectl apply -f k8s/production/frontend.yml

      - name: Roll out release image
        run: |
          kubectl set image deployment/backend \
            backend=${{ steps.ecr-login.outputs.registry }}/hms-backend:${{ github.sha }} \
            -n production
          kubectl set image deployment/frontend \
            frontend=${{ steps.ecr-login.outputs.registry }}/hms-frontend:${{ github.sha }} \
            -n production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n production --timeout=300s
          kubectl rollout status deployment/frontend -n production --timeout=300s

      - name: Rollback on failed rollout
        if: failure()
        run: |
          kubectl rollout undo deployment/backend -n production
          kubectl rollout undo deployment/frontend -n production

      - name: Print production URL
        run: kubectl get svc frontend -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'