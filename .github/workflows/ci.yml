name: ci
on:
  pull_request:
    branches: [main]
env:
    PYTHON_VERSION: "3.11"
    NODE_VERSION: "22"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION}}
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Backend Black Linting
        working-directory: backend
        run: black --check .

      - name: Backend Flake8 Linting
        working-directory: backend
        run: flake8 .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION}}
          cache: "yarn"
          cache-dependency-path: ./frontend/yarn.lock

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend Eslint Linting
        working-directory: frontend
        run: yarn eslint src --max-warnings=0

  backend-test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wayfarer
          POSTGRES_PASSWORD: wayfarer_dev_pw
          POSTGRES_DB: wayfarer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayfarer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION}}
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://wayfarer:wayfarer_dev_pw@localhost:5432/wayfarer
        run: alembic upgrade head

      - name: Start backend app
        working-directory: backend
        env:
          DATABASE_URL: postgresql://wayfarer:wayfarer_dev_pw@localhost:5432/wayfarer
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done

      - name: Run Backend Tests
        run: pytest tests/api --maxfail=1 --disable-warnings -q

  frontend-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION}}
          cache: "yarn"
          cache-dependency-path: ./frontend/yarn.lock

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: frontend
        run: yarn test --watchAll=false --passWithNoTests

  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure ECR repos exist
        run: |
          aws ecr describe-repositories --repository-names hms-backend 2>/dev/null || \
            aws ecr create-repository --repository-name hms-backend
          aws ecr describe-repositories --repository-names hms-frontend 2>/dev/null || \
            aws ecr create-repository --repository-name hms-frontend

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/hms-backend:${{ github.event.pull_request.head.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/hms-frontend:${{ github.event.pull_request.head.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name hms-cluster --region ${{ vars.AWS_REGION }}

      - name: Apply manifests (structure/drift safety)
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/postgres.yml
          kubectl apply -f k8s/backend.yml
          kubectl apply -f k8s/frontend.yml

      - name: Roll out new images
        run: |
          kubectl set image deployment/backend \
            backend=${{ needs.build-and-push.outputs.registry }}/hms-backend:${{ github.event.pull_request.head.sha }} \
            -n staging
          kubectl set image deployment/frontend \
            frontend=${{ needs.build-and-push.outputs.registry }}/hms-frontend:${{ github.event.pull_request.head.sha }} \
            -n staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n staging --timeout=180s
          kubectl rollout status deployment/frontend -n staging --timeout=180s

      - name: Rollback on failed rollout
        if: failure()
        run: |
          kubectl rollout undo deployment/backend -n staging
          kubectl rollout undo deployment/frontend -n staging

      - name: Print staging URL
        run: kubectl get svc frontend -n staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'

  e2e:
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Playwright specs from hms-test
        uses: actions/checkout@v6
        with:
          repository: prithvi08242/hotel-managment-test
          path: e2e-specs
 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
 
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name hms-cluster --region ${{ vars.AWS_REGION }}
 
      - name: Get staging URL
        id: staging-url
        run: |
          URL=$(kubectl get svc frontend -n staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "url=http://$URL" >> "$GITHUB_OUTPUT"
 
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
 
      - name: Install Playwright
        working-directory: e2e-specs
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
 
      - name: Run E2E tests against staging
        working-directory: e2e-specs
        env:
          BASE_URL: ${{ steps.staging-url.outputs.url }}
        run: npx playwright test
 
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e-specs/playwright-report/
          retention-days: 7
 
  go-no-go:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Go decision
        run: echo "✅ GO — E2E passed against staging. Safe to merge."