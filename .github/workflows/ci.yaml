name: ci
on:
  pull_request:
    branches: [main]
env:
    PYTHON_VERSION: "3.11"
    NODE_VERSION: "22"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION}}
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Python Version
        run: python --version

      - name: Install Backend Dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Linting Tools
        run: pip install black flake8

      - name: Backend Black Linting
        working-directory: backend
        run: black --check .

      - name: Backend Flake8 Linting
        working-directory: backend
        # Flake8's default limit is 79 chars, 88 matches Black's default, so the two tools agree.
        run: flake8 . --max-line-length=88

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION}}
          cache: "yarn"
          cache-dependency-path: ./frontend/yarn.lock

      - name: Node version
        run: node --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend Eslint Linting
        working-directory: frontend
        run: yarn eslint src --max-warnings=0

  backend-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION}}
          cache: "pip"
          cache-dependency-path: ./backend/requirements.txt

      - name: Python Version
        run: python --version

      - name: Install Backend Dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend app
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run Backend Tests
        run: pytest tests/api --maxfail=1 --disable-warnings -q

  frontend-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION}}
          cache: "yarn"
          cache-dependency-path: ./frontend/yarn.lock

      - name: Node version
        run: node --version

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run Frontend Tests
        working-directory: frontend
        run: yarn test --watchAll=false --passWithNoTests

  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/hms-backend:${{ github.event.pull_request.head.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/hms-frontend:${{ github.event.pull_request.head.sha }}
